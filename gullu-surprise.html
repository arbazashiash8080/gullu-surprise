const DEFAULT_IMGS={};

/* ============================================================
   BIRTHDAY SURPRISE — gift engine
   Pure, dependency-free. giftBoot(cfg) renders into #gift.
   ============================================================ */
function giftDefaults(){
  return {
    name:'Aarav', sender:'Priya', age:21, pronoun:'he',
    message:'Happy birthday! Thank you for being the kind of friend who turns ordinary days into little adventures. I hope this year brings you as much laughter and warmth as you bring everyone around you. Make a big wish — you deserve it all.',
    cover:{ headline:'A BIRTHDAY SURPRISE', sub:'Someone made this just for you', tagline:'A little something wrapped with care', btn:'Open it \u{1F381}', bg:'#fffdf9', ink:'#1c1917' },
    candles:{ label:'HOW MANY CANDLES TODAY', years:'YEARS OF BEING REMARKABLE', happy:'\u{1F382} Happy Birthday!', btn:'Open the balloons \u2726', bg:'#1c1211', gold:'#f5b942' },
    balloons:{ title:'Pop every balloon \u{1F388}', sub:'Each one holds something true', counter:'{n} left to pop', allDone:'All popped! \u{1F38A}', cardBtn:'POP ANOTHER \u2197', doneTitle:'You got them all.', doneText:'Every balloon popped, every truth revealed. Now for the real thing \u2014 the letter they wrote.', doneBtn:'\u{1F48C} Read the letter', bg:'#fdf2f8', ink:'#1c1917',
      colors:['#f97316','#ef4444','#22c55e','#3b82f6','#a855f7','#ec4899'] },
    cards:[
      { img:'card1', caption:'{cap1}', sub:'WITH LOVE \u{1F973}' },
      { img:'card2', caption:'The most quietly iconic human I know \u{1F382}', sub:'WITH LOVE \u{1F973}' },
      { img:'card3', caption:'Genuinely one of the good ones \u{1F49B}', sub:'WITH LOVE \u{1F973}' },
      { img:'card4', caption:'Here\u2019s to a whole year of you thriving \u{1F942}', sub:'WITH LOVE \u{1F973}' },
      { img:'card5', caption:'Nobody has your specific kind of magic \u{1F305}', sub:'WITH LOVE \u{1F973}' }
    ],
    letter:{ greeting:'Hey {name},', signoff:'Always, {sender} \u2726', btn:'One last thing \u{1F38A}', bg:'#fffbeb', cardBg:'#ffffff', body:'' },
    finale:{ title:'One last thing \u{1F38A}', memeText:'YOU OTTER BE PROUD OF YOURSELF!', img:'finale', excerpt:'', sign:'\u2014 {sender}', bg:'#fdf2f8' },
    meta:{ title:'\u{1F382} Happy Birthday!' }
  };
}
function giftCap1(pronoun){
  return { she:'She walked in and made everything better \u2726',
           he:'He walked in and made everything better \u2726',
           they:'They walked in and made everything better \u2726',
           none:'You walked in and made everything better \u2726' }[pronoun] || 'You walked in and made everything better \u2726';
}
function gEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gFill(s, cfg){
  return String(s==null?'':s).replace(/\{name\}/g, cfg.name).replace(/\{sender\}/g, cfg.sender)
    .replace(/\{age\}/g, cfg.age).replace(/\{n\}/g, cfg._n!=null?cfg._n:'').replace(/\{cap1\}/g, giftCap1(cfg.pronoun));
}
function gImg(v){
  if(!v) return '';
  if(/^(data:|https?:|blob:)/.test(v)) return v;
  try{ if(typeof DEFAULT_IMGS!=='undefined' && DEFAULT_IMGS[v]) return DEFAULT_IMGS[v]; }catch(e){}
  return '';
}

`;}
function giftShade(hex, amt){
  const n=parseInt(hex.replace('#',''),16); let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function giftBuild(root, cfg){
  const D=giftDefaults();
  cfg=Object.assign({}, D, cfg||{});
  ['cover','candles','balloons','letter','finale','meta'].forEach(k=>{ cfg[k]=Object.assign({},D[k],cfg[k]||{}); });
  if(!Array.isArray(cfg.cards)||!cfg.cards.length) cfg.cards=D.cards;
  cfg.age=Math.max(1,Math.min(120,parseInt(cfg.age)||1));
  const q=s=>root.querySelector(s);
  const F=s=>gFill(s,cfg);
  const letterBody=(cfg.letter.body&&cfg.letter.body.trim())?cfg.letter.body:cfg.message;
  const excerpt=(cfg.finale.excerpt&&cfg.finale.excerpt.trim())?cfg.finale.excerpt
    : (cfg.message.length>120?cfg.message.slice(0,120).trim()+'\u2026':cfg.message);
  const sparks=Array.from({length:9},(_,i)=>
    `<span class="g-spark" style="left:${6+Math.random()*88}%;top:${8+Math.random()*84}%;font-size:${12+Math.random()*16}px;animation-delay:${(Math.random()*2.6).toFixed(2)}s">\u2726</span>`).join('');
  root.innerHTML=`
  <div class="g-dots" id="gDots">${[1,2,3,4,5].map(i=>`<button class="g-dot${i===1?' active':''}" data-go="${i}" aria-label="Page ${i}"></button>`).join('')}</div>
  <section class="g-step active" id="gs1" style="background:${gEsc(cfg.cover.bg)}">${sparks}
    <div class="g-cover-gift">\u{1F381}</div>
    <h1 class="g-eyebrow" style="color:${gEsc(cfg.cover.ink)}">${gEsc(F(cfg.cover.headline))}</h1>
    <p class="g-sub">${gEsc(F(cfg.cover.sub))}</p>
    <p class="g-tag">${gEsc(F(cfg.cover.tagline))}</p>
    <button class="g-btn" data-go="2">${gEsc(F(cfg.cover.btn))}</button>
  </section>
  <section class="g-step" id="gs2" style="background:${gEsc(cfg.candles.bg)}">
    <canvas class="g-fx" id="gEmbers"></canvas>
    <div style="position:relative;z-index:5">
      <div class="g-label" style="color:${gEsc(cfg.candles.gold)}">${gEsc(F(cfg.candles.label))}</div>
      <div class="g-bignum" style="color:${gEsc(cfg.candles.gold)}" id="gNum">0</div>
      <div class="g-rule" style="background:${gEsc(cfg.candles.gold)}"></div>
      <div class="g-years" style="color:${gEsc(cfg.candles.gold)}">${gEsc(F(cfg.candles.years))}</div>
      <div class="g-barwrap"><div class="g-bar" id="gBar"></div></div>
      <div class="g-happy" id="gHappy">Lighting the candles\u2026</div>
      <button class="g-btn orange g-fadein" id="gCandleBtn" data-go="3">${gEsc(F(cfg.candles.btn))}</button>
    </div>
  </section>
  <section class="g-step" id="gs3" style="background:${gEsc(cfg.balloons.bg)}">
    <canvas id="gBalloonCv"></canvas>
    <div class="g-bhead" id="gBHead">
      <div class="g-btitle" style="color:${gEsc(cfg.balloons.ink)}">${gEsc(F(cfg.balloons.title))}</div>
      <div class="g-bsub">${gEsc(F(cfg.balloons.sub))}</div><br>
      <div class="g-counter" id="gCount"></div>
    </div>
    <div class="g-alldone" id="gAllDone">
      <h3 style="color:${gEsc(cfg.balloons.ink)}">${gEsc(F(cfg.balloons.doneTitle))}</h3>
      <p>${gEsc(F(cfg.balloons.doneText))}</p>
      <button class="g-btn" data-go="4">${gEsc(F(cfg.balloons.doneBtn))}</button>
    </div>
    <div class="g-cardmodal" id="gCardModal"><div class="g-polaroid">
      <img id="gCardImg" alt="surprise">
      <div class="g-polcap" id="gCardCap"></div>
      <div class="g-polsub" id="gCardSub"></div>
      <button class="g-btn" id="gCardBtn"></button>
    </div></div>
  </section>
  <section class="g-step" id="gs4" style="background:${gEsc(cfg.letter.bg)}">
    <div class="g-lettercard" id="gLetterCard" style="background:${gEsc(cfg.letter.cardBg)}">
      <div class="g-pin"></div>
      <div class="g-lgreet">${gEsc(F(cfg.letter.greeting))}</div>
      <div class="g-lbody" id="gLetterBody"></div>
      <div class="g-lsign g-fadein" id="gLetterSign">${gEsc(F(cfg.letter.signoff))}</div>
    </div>
    <button class="g-btn g-letterbtn g-fadein" id="gLetterBtn" data-go="5">${gEsc(F(cfg.letter.btn))}</button>
  </section>
  <section class="g-step" id="gs5" style="background:${gEsc(cfg.finale.bg)}">
    <canvas class="g-fx" id="gConfetti"></canvas>
    <div class="g-ftitle">${gEsc(F(cfg.finale.title))}</div>
    <div class="g-meme">
      <img id="gMemeImg" alt="celebration">
      <div class="g-memetxt">${gEsc(F(cfg.finale.memeText))}</div>
    </div>
    <p class="g-excerpt">\u201C${gEsc(F(excerpt))}\u201D</p>
    <p class="g-sign">${gEsc(F(cfg.finale.sign))}</p>
  </section>`;
  /* ---------- navigation ---------- */
  let step=1, rafIds=[];
  const later=fn=>{const id=requestAnimationFrame(fn); rafIds.push(id); return id;};
  const killFx=()=>{rafIds.forEach(cancelAnimationFrame); rafIds=[];};
  function updDots(){ q('#gDots').querySelectorAll('.g-dot').forEach((d,i)=>{
    d.classList.toggle('active', i+1===step); d.classList.toggle('done', i+1<step); }); }
  function go(n){
    killFx(); q('#gCardModal').classList.remove('show');
    q('#gs'+step).classList.remove('active'); step=n;
    q('#gs'+n).classList.add('active'); updDots();
    if(n===2) enterCandles(); if(n===3) enterBalloons();
    if(n===4) enterLetter(); if(n===5) enterFinale();
    if(root._giftStep) root._giftStep(n);
  }
  root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation(); go(+b.dataset.go);}));
  /* ---------- step 2 · candles ---------- */
  function enterCandles(){
    const num=q('#gNum'), bar=q('#gBar'), happy=q('#gHappy'), btn=q('#gCandleBtn');
    num.textContent='0'; bar.style.width='0%'; btn.classList.remove('show'); happy.textContent='Lighting the candles\u2026';
    let t0=null; const dur=1500;
    const tick=t=>{ if(!t0)t0=t; const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      num.textContent=Math.round(e*cfg.age); bar.style.width=(e*100)+'%';
      if(p<1) later(tick); else { happy.textContent=F(cfg.candles.happy); btn.classList.add('show'); } };
    later(tick);
    const cv=q('#gEmbers'), ctx=cv.getContext('2d');
    const parts=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),s:.6+Math.random()*2.2,
      v:.0009+Math.random()*.0022, ph:Math.random()*7, hue:32+Math.random()*14}));
    const gold=cfg.candles.gold;
    const loop=t=>{ const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
      if(cv.width!==Math.round(r.width*dpr)){cv.width=r.width*dpr; cv.height=r.height*dpr;}
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
      parts.forEach(p=>{ p.y-=p.v; if(p.y<-.05){p.y=1.05;p.x=Math.random();}
        const tw=.35+.65*Math.abs(Math.sin(t/700+p.ph));
        ctx.globalAlpha=tw; ctx.fillStyle=gold;
        ctx.beginPath(); ctx.arc(p.x*r.width, p.y*r.height, p.s, 0, 7); ctx.fill(); });
      ctx.globalAlpha=1; later(loop); };
    later(loop);
  }
  /* ---------- step 3 · balloons ---------- */
  function drawBalloon(ctx,b,t){
    const sway=Math.sin(t/900+b.ph)*13, x=b.x+sway, y=b.y;
    ctx.strokeStyle='rgba(90,80,70,.5)'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(x,y+b.r*.95); ctx.quadraticCurveTo(x+11,y+b.r+34,x-7,y+b.r+66); ctx.stroke();
    const g=ctx.createRadialGradient(x-b.r*.3,y-b.r*.35,b.r*.12,x,y,b.r*1.2);
    g.addColorStop(0,giftShade(b.color,36)); g.addColorStop(1,giftShade(b.color,-22));
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,b.r*.84,b.r,0,0,7); ctx.fill();
    ctx.fillStyle=giftShade(b.color,-30); ctx.beginPath();
    ctx.moveTo(x-5,y+b.r*.9); ctx.lineTo(x+5,y+b.r*.9); ctx.lineTo(x,y+b.r*1.05); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.42)'; ctx.beginPath();
    ctx.ellipse(x-b.r*.32,y-b.r*.36,b.r*.18,b.r*.28,-.5,0,7); ctx.fill();
  }
  function popSound(){ try{
    const C=window.__gAC||(window.__gAC=new (window.AudioContext||window.webkitAudioContext)());
    if(C.state==='suspended')C.resume();
    const o=C.createOscillator(), g=C.createGain(), t=C.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(540,t); o.frequency.exponentialRampToValueAtTime(130,t+.13);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g); g.connect(C.destination); o.start(t); o.stop(t+.17);
  }catch(e){} }
  function enterBalloons(){
    const cv=q('#gBalloonCv'), ctx=cv.getContext('2d');
    const pal=(cfg.balloons.colors&&cfg.balloons.colors.length?cfg.balloons.colors:['#f97316']);
    let W=0,H=0;
    const size=()=>{ const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
      W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
    size();
    const balloons=cfg.cards.map((c,i)=>({ card:c, color:pal[i%pal.length], popped:false,
      x:40+Math.random()*Math.max(60,W-80), y:Math.random()*(H+140)-90,
      r:32+Math.random()*12, sp:.5+Math.random()*.7, ph:Math.random()*7 }));
    root._dbgBalloons=()=>balloons.map(b=>({x:b.x+Math.sin(performance.now()/900+b.ph)*13, y:b.y, r:b.r, popped:b.popped}));
    let parts=[];
    const updCount=()=>{ const left=balloons.filter(b=>!b.popped).length;
      cfg._n=left; q('#gCount').textContent=left>0?F(cfg.balloons.counter):F(cfg.balloons.allDone); };
    updCount();
    const loop=t=>{ size();
      ctx.clearRect(0,0,W,H);
      balloons.forEach(b=>{ if(b.popped)return; b.y-=b.sp; if(b.y<-90){b.y=H+70; b.x=40+Math.random()*Math.max(60,W-80);}
        drawBalloon(ctx,b,t); });
      parts=parts.filter(p=>p.life>0);
      parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=.016;
        ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); });
      ctx.globalAlpha=1; later(loop); };
    later(loop);
    cv.onclick=e=>{
      const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
      for(let i=balloons.length-1;i>=0;i--){ const b=balloons[i]; if(b.popped)continue;
        const sway=Math.sin(performance.now()/900+b.ph)*13;
        if((mx-(b.x+sway))**2+(my-b.y)**2 < (b.r*1.05)**2){ pop(b); break; } }
    };
    const cardQueue=[];
    function showNextCard(){
      const c=cardQueue.shift(); if(!c) return;
      const src=gImg(c.img);
      const im=q('#gCardImg'); im.src=src||''; im.style.display=src?'block':'none';
      q('#gCardCap').textContent=F(c.caption);
      q('#gCardSub').textContent=F(c.sub);
      q('#gCardBtn').textContent=F(cfg.balloons.cardBtn);
      q('#gCardModal').classList.add('show');
    }
    function pop(b){
      b.popped=true; popSound();
      for(let i=0;i<26;i++){ const a=Math.random()*7, sp=1.5+Math.random()*3.5;
        parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,s:2+Math.random()*3.5,color:i%3?b.color:'#ffffff',life:1}); }
      cardQueue.push(b.card);
      if(!q('#gCardModal').classList.contains('show')) setTimeout(showNextCard,200);
      updCount();
    }
    q('#gCardBtn').onclick=()=>{
      q('#gCardModal').classList.remove('show');
      if(cardQueue.length) setTimeout(showNextCard,250);
      else if(balloons.every(b=>b.popped)){ q('#gBHead').style.display='none'; q('#gAllDone').classList.add('show'); }
    };
    q('#gBHead').style.display=''; q('#gAllDone').classList.remove('show');
  }
  /* ---------- step 4 · letter ---------- */
  function enterLetter(){
    const bodyEl=q('#gLetterBody'), sign=q('#gLetterSign'), btn=q('#gLetterBtn');
    bodyEl.innerHTML=''; sign.classList.remove('show'); btn.classList.remove('show');
    const full=F(letterBody); let i=0, done=false;
    const finish=()=>{ if(done)return; done=true; bodyEl.textContent=full;
      sign.classList.add('show'); btn.classList.add('show'); };
    const tick=()=>{ if(done)return;
      bodyEl.innerHTML=gEsc(full.slice(0,++i))+'<span class="g-lcaret"></span>';
      if(i>=full.length) finish(); else setTimeout(tick, 18); };
    tick();
    q('#gLetterCard').onclick=finish;
  }
  /* ---------- step 5 · finale ---------- */
  function enterFinale(){
    const src=gImg(cfg.finale.img), im=q('#gMemeImg');
    im.src=src||''; im.style.display=src?'block':'none';
    const cv=q('#gConfetti'), ctx=cv.getContext('2d');
    const pal=['#f59e0b','#f97316','#ef4444','#ec4899','#a855f7','#3b82f6','#22c55e'];
    const ps=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*-1,
      w:5+Math.random()*6,h:8+Math.random()*8,vy:.002+Math.random()*.004,
      ph:Math.random()*7,c:pal[(Math.random()*pal.length)|0],r:Math.random()*7}));
    const loop=t=>{ const r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
      if(cv.width!==Math.round(r.width*dpr)){cv.width=r.width*dpr; cv.height=r.height*dpr;}
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
      ps.forEach(p=>{ p.y+=p.vy; if(p.y>1.05){p.y=-.05;p.x=Math.random();}
        const x=p.x*r.width+Math.sin(t/800+p.ph)*16;
        ctx.save(); ctx.translate(x,p.y*r.height); ctx.rotate(p.r+t/1600);
        ctx.fillStyle=p.c; ctx.globalAlpha=.9; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
      ctx.globalAlpha=1; later(loop); };
    later(loop);
  }
  root._gift={ go, step:()=>step };
}

  giftBuild(document.getElementById('gift'), cfg);

n dil ton chaundi haan ki tuhadi zindagi vich kade kise cheez di kami na hove. Tuhade saare supne poore hon, har manzil tuhanu mile te tusi hamesha khush raho ❤️\n\nTuhade naal gallan karna, tuhadi fikar karna te tuhanu khush dekhna mainu sach-much bahut pasand ae. Kade-kade lagda ae ki tusi meri aadat ban gaye ho. Din kina vi busy hove, ik vaar tuhadda khayal zaroor aa hi janda ae. ❤️\n\nAjj de din main Allah agge bas ehi dua kardi haan ki tuhadi zindagi hamesha khushiyan naal bhari rahe. Tuhade chehre di muskurahat kade ghatt na hove te tusi dil ton jis cheez di chah rakho, oh tuhanu zaroor mile 🤲❤️\n\nTe haan, thank you... meri zindagi vich aun layi, meri gallan sunan layi, te bina kujh kahe vi mainu samajh lain layi. Tusi sach-much mere layi bahut special ho 🧿💗\n\nJanamdin mubarak hove, mere kaakee ❤️❤️❤️\nAjj da din tuhade naam, te meri har dua vi tuhade naam\nKhush raho, muskuraunde raho, te hamesha mere dil de sab ton kareeb raho ❤️"},"finale":{"title":"One last thing 🎊","memeText":"MY SANTRAA BILLU BE PROUD OF YOURSELF!","img":"data:image/webp;base64,UklGRjBFAgBXRUJQVlA4WAoAAAAgAAAAuwIAHwMASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggQkMCAPDjBp0BKrwCIAM+YSaORSQiIRfLLqxABgSgC+gpXbn1i9m0ZfJvg79+/J+eHu37h83F6r/x+vX9m+xV+0HUv84nmXeqT+deqt/Pv+d16npAebD/9vaY/rH/lte/iH+98B/yj6N/Zf3f/Ofs3+9n2Cfb//n/p++96b/Pf/P/X+of85/I39n/Jf6j3h/y3/q/1XjD8o/+v/R+wX+cf2L/rf4n1rPx/2974DiP+B/9f+D7DXxF+Y/an05Pxf/r/sfWr
